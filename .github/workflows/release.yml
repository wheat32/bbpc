name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write   # needed to create releases and upload assets

jobs:
  build-native:
    name: Build Native x86_64 (Arch Linux)
    runs-on: ubuntu-26.04
    container:
      image: archlinux:latest

    steps:
      - name: Install git
        run: pacman -Syu --noconfirm --needed git

      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Trust the checkout
        run: git config --global --add safe.directory '*'

      - name: Install build dependencies
        run: bash packaging/arch/install-deps.sh

      - name: Configure
        run: cmake --preset release

      - name: Build
        run: cmake --build --preset release --parallel

      - name: Package tarball
        # The installed tree: bin/bbpc (the launcher) and share/bbpc (run.sh, its scripts and the
        # prebuilt binaries), using Arch's own libraries.
        run: |
          DESTDIR="$PWD/stage" cmake --install out --prefix /usr
          find stage/usr/share/bbpc/bin -type f \( -name '*.so*' -o -perm -u+x \) -exec strip --strip-debug {} +
          tar -czf bbpc-linux-x86_64.tar.gz -C stage/usr .

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v7
        with:
          name: native-tarball-x86_64
          path: bbpc-linux-x86_64.tar.gz

  build-appimage:
    name: Build AppImage x86_64 (Arch Linux)
    runs-on: ubuntu-26.04
    container:
      image: archlinux:latest

    steps:
      - name: Install git
        run: pacman -Syu --noconfirm --needed git

      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Trust the checkout
        run: git config --global --add safe.directory '*'

      - name: Install dependencies
        run: |
          bash packaging/arch/install-deps.sh
          pacman -S --noconfirm --needed wget file

      - name: Build AppImage x86_64
        run: bash packaging/appimage/build-appimage.sh
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: appimage-x86_64
          path: dist/Bloodborne-bbpc-*-x86_64.AppImage

  release:
    name: Create GitHub Release
    runs-on: ubuntu-26.04
    needs: [build-native, build-appimage]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Read version
        id: tag
        run: |
          VERSION=$(jq -r '.app_version' version.json)
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "TAG=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "NAME=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download native tarball x86_64
        uses: actions/download-artifact@v8
        with:
          name: native-tarball-x86_64

      - name: Download AppImage x86_64
        uses: actions/download-artifact@v8
        with:
          name: appimage-x86_64

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.TAG }}
          name: ${{ steps.tag.outputs.NAME }}
          body: |
            Automated release built from commit ${{ github.sha }}.

            **Commit message:** ${{ github.event.head_commit.message }}

            > **No game files are included.** You need your own decrypted dump of Bloodborne with update 1.09 (CUSA03173, CUSA00900 or another retail release).

            ## Downloads

            | File | Architecture | Description |
            |------|--------------|-------------|
            | `Bloodborne-bbpc-${{ steps.tag.outputs.VERSION }}-x86_64.AppImage` | x86_64 | AppImage: the launcher, the prebuilt port and the libraries it needs |
            | `bbpc-linux-x86_64.tar.gz` | x86_64 | Native build for Arch Linux (uses the system's libraries) |

            Both need a Vulkan 1.3 GPU driver, bash and Python 3.10 or newer on the system. The AppImage needs a glibc at least as new as the Arch Linux it was built on; on older distributions, build from source.

            ### AppImage
            ```bash
            chmod +x Bloodborne-bbpc-${{ steps.tag.outputs.VERSION }}-x86_64.AppImage
            ./Bloodborne-bbpc-${{ steps.tag.outputs.VERSION }}-x86_64.AppImage
            ```
            Add `--play` to start the game with the saved settings without the launcher window (Steam's game mode).

            ### Native build (Arch Linux)
            Install the runtime packages first (`bash packaging/arch/install-deps.sh` from the source, or the libraries listed in `packaging/arch/packages.txt`).
            ```bash
            mkdir -p ~/.local/opt/bbpc
            tar -xzf bbpc-linux-x86_64.tar.gz -C ~/.local/opt/bbpc
            ~/.local/opt/bbpc/bin/bbpc
            ```

            > This is a community build, a fork of [bloodborne_pc](https://github.com/deadinside28/bloodborne_pc). See the [README](https://github.com/${{ github.repository }}/blob/main/README.md) for requirements and usage.
          files: |
            Bloodborne-bbpc-${{ steps.tag.outputs.VERSION }}-x86_64.AppImage
            bbpc-linux-x86_64.tar.gz
          make_latest: true
